name: TRADER X Content Agent

on:
  workflow_dispatch:
  push:
    paths:
      - 'input/idea.md'
      - 'prompts/content_agent.md'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate content with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request
          from pathlib import Path

          key = os.environ.get('GEMINI_API_KEY')
          if not key:
              raise SystemExit('GEMINI_API_KEY secret is not configured.')

          idea = Path('input/idea.md').read_text(encoding='utf-8')
          prompt = Path('prompts/content_agent.md').read_text(encoding='utf-8')
          full = prompt + '\n\nایده خام:\n' + idea

          url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + key
          payload = {'contents': [{'parts': [{'text': full}]}]}
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type': 'application/json'},
              method='POST'
          )
          with urllib.request.urlopen(req, timeout=120) as r:
              data = json.load(r)

          text = data['candidates'][0]['content']['parts'][0]['text']
          Path('output').mkdir(exist_ok=True)
          Path('output/content.md').write_text(text, encoding='utf-8')
          PY

      - name: Commit generated content
        run: |
          git config user.name 'TRADER X Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/content.md
          git diff --cached --quiet || git commit -m 'Generate TRADER X content'
          git push
