name: TRADER X Content Engine

on:
  workflow_dispatch:
  push:
    paths:
      - 'input/**'
      - 'prompts/**'
      - 'src/**'
      - 'schemas/**'
      - '.github/workflows/trader-x-agent.yml'

permissions:
  contents: write

concurrency:
  group: trader-x-content
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate source
        run: python -m compileall -q src

      - name: Generate TRADER X content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.main

      - name: Validate generated JSON
        run: python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('output/publish.json').read_text(encoding='utf-8'))
          required = ['brand', 'language', 'topic', 'hook', 'youtube_titles', 'short_script', 'long_script', 'instagram_caption', 'hashtags', 'cta', 'monetization_angle', 'status']
          missing = [k for k in required if k not in data]
          if missing:
              raise SystemExit(f'Missing fields: {missing}')
          if data['status'] != 'draft':
              raise SystemExit('New content must start with status=draft')
          print('JSON validation: OK')
          PY

      - name: Commit generated package
        run: |
          git config user.name 'TRADER X Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/
          git diff --cached --quiet || git commit -m 'Generate TRADER X content [skip ci]'
          git push
